name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # يزامن مجلد dist/ فقط مع مجلد public_html، ويحذف أي ملفات بناء قديمة (--delete)
      # ملاحظة مهمة: public_html مشترك مع الباك اند — فيه index.php و.htaccess تبع Laravel
      # (يوجّه /api للباك اند وكل شي ثاني لـ index.html) — لازم نستثنيهم عشان --delete ما يمسحهم
      - name: Sync dist/ via rsync over SSH
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.FRONTEND_PATH }}
          ARGS: "-rlgoDzvc --delete --exclude=.htaccess --exclude=index.php --exclude=default.php --exclude=robots.txt"
