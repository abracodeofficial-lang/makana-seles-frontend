<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة العقارات والموارد البشرية</title>
  <meta name="theme-color" content="#19130F" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="مكانة" />
  <script>
    // الثيم قبل أول رسم: المحفوظ، وإلا إعداد الجهاز
    (function () {
      var t; try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      if (t === 'light') {
        document.documentElement.classList.add('light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F0E7');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-950">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
